name: render-cards
on:
  push:
    branches: [main]
    paths: ['bundles/**.json', '.github/workflows/render.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-cards
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Chrome
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx -y playwright@1.56.1 install chromium
            echo "CHROME_PATH=$(ls -d ~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | head -1)" >> "$GITHUB_ENV"
          fi
      - name: Render
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'bundles/*.json' 2>/dev/null || true)
          echo "bundles: ${CHANGED:-latest}"
          node render/render.mjs $CHANGED
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts queue render/last-report.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "render: $(date -u +%Y-%m-%d) cards"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
